# Template for one private Nginx Proxy Manager host's Advanced configuration.
# Save the effective host-specific policy in the private operations record.
# Keep deployment addresses and access lists out of this repository.
#
# NPM generates a raw request-target access log for each host. Disable it at
# server scope so rejections before location selection cannot expose a token.
# Retain the app's structured logs. Qualify the selected host and any shared
# default listeners or upstream proxies separately with synthetic markers.
access_log off;

location ^~ /plus/api/native-tv-test/v1/direct {
    access_log off;
    error_log /dev/null crit;

    # Copy the existing root location's access rules and authentication here.
    # This placeholder denies every request until the private policy is filled in.
    deny all;
    satisfy all;

    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_http_version 1.1;

    # Mirror the private host's HSTS rule if enabled. proxy.conf adds its own
    # response header, so the server-level add_header alone is not inherited.
    # add_header Strict-Transport-Security $hsts_header always;
    include conf.d/include/proxy.conf;
}
