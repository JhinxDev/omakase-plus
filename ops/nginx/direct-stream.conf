# Add to the Omakase proxy host server block in Nginx Proxy Manager.
# Uses the proxy host's existing upstream and forwarded-header configuration.
location ^~ /plus/api/native-tv-test/v1/direct {
    access_log off;
    error_log /dev/null crit;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    include conf.d/include/proxy.conf;
}
