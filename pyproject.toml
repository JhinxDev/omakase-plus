[project]
name = "omakase"
version = "0.4.0"
description = "Self-hosted anime, movie and TV discovery, viewing progress, ratings and connected library management."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HeyiTzSenpai" }]
keywords = ["anime", "recommendations", "llm", "anilist", "myanimelist", "ai", "cli", "movies", "tv", "plex", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
]

dependencies = [
    "click>=8.0",
    "httpx[http2]>=0.28.1",
    "h2>=4.4.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.27",
    "argon2-cffi>=23.1",
    "cryptography>=50.0.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.31",
    "jinja2>=3.1",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
agents = [
    "mcp>=2.2.0,<3",
]

[project.urls]
Homepage = "https://github.com/JhinxDev/omakase-plus"
Repository = "https://github.com/JhinxDev/omakase-plus"
Issues = "https://github.com/JhinxDev/omakase-plus/issues"

[dependency-groups]
build = ["build==1.6.1", "setuptools==84.2.1"]

[project.scripts]
omakase = "omakase.cli:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omakase = [
    "web/templates/*.html",
    "web/static/*",
    "plus/templates/*.html",
    "plus/static/*",
    "plus/static/services/*.png",
    "plus/static/services/provenance.json",
    "plus/migrations/*.sql",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
