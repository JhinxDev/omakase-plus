<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>{{ title }} · Omakase</title>
  <link rel="preload" href="/plus/static/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/plus/static/omakase-icon.svg?v={{ asset_version }}">
  <link rel="stylesheet" href="/plus/static/dashboard.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/plus/static/atmosphere.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/plus/static/cinema.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/plus/static/semantic-states.css?v={{ asset_version }}">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-story" aria-labelledby="error-brand">
      <div>
        <img class="brand-seal" src="/plus/static/omakase-seal.svg" alt="">
        <h2 id="error-brand">A wrong <i>turn.</i></h2>
        <p>This page is not on the menu. Head back to what is.</p>
      </div>
      <footer><span>Your account.</span><span>Your collection.</span></footer>
    </section>
    <section class="auth-form-panel" aria-labelledby="error-heading">
      <div class="auth-form-wrap">
        <span class="page-kicker">{{ error_code }}</span>
        <h1 id="error-heading">{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="button button-primary button-wide" href="{{ '/plus/home' if signed_in else '/plus/login' }}">{{ 'Back to your library' if signed_in else 'Sign in' }}</a>
        <div class="auth-switch"><a href="/plus/login">Go to the sign-in page →</a></div>
      </div>
    </section>
  </main>
</body>
</html>
