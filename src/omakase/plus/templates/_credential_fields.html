{% macro credential_input(field_id, field_name, saved=false, required=false, maxlength=512) -%}
<div class="credential-control" data-credential-control>
  {% if saved %}
  <p class="credential-saved">Key saved securely</p>
  <details class="credential-editor" data-credential-editor>
    <summary>Change key</summary>
    <div class="credential-replacement">
      <label for="{{ field_id }}">Replacement key</label>
      <input type="password" id="{{ field_id }}" name="{{ field_name }}" maxlength="{{ maxlength }}" placeholder="Paste replacement key" autocomplete="new-password" autocapitalize="none" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore="true" data-credential-input>
      <p>Your saved key is never shown. Saving replaces it with this new key.</p>
      <button type="button" class="button button-secondary" data-credential-cancel>Cancel</button>
    </div>
  </details>
  {% else %}
  <input type="password" id="{{ field_id }}" name="{{ field_name }}" maxlength="{{ maxlength }}" placeholder="Paste your key" autocomplete="new-password" autocapitalize="none" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore="true" {% if required %}required{% endif %}>
  {% endif %}
</div>
{%- endmacro %}
