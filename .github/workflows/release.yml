name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or update (e.g. v0.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag="${INPUT_TAG:-$REF_NAME}"
          if [[ "$release_tag" != v* ]]; then
            echo "Release tag must start with 'v' (got: $release_tag)" >&2
            exit 1
          fi
          echo "name=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify release notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          python ops/release/github_release_notes.py \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${RELEASE_TAG#v}"
          title="Omakase Plus ${version}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file "$notes_file"
          elif [[ "$version" == *-* ]]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes_file" \
              --latest
          fi
