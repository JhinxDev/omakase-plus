name: Unsigned tvOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test, build and package tvOS
        run: bash scripts/build-tvos.sh "$RUNNER_TEMP/omakase-tvos"
      - name: Upload unsigned IPA and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omakase-tvos-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/omakase-tvos/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

