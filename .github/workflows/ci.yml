name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        # Base images are pinned by digest in the Dockerfile. Building here proves
        # the public tree still produces the shipped image without pulling a
        # different base or relying on an untracked local file.
        run: docker build --build-arg OMAKASE_REVISION=${{ github.sha }} -t omakase-plus:ci .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned recovery fixture commit
        # tests/plus/test_player_recovery_overlay.py regenerates and archives the
        # accepted old source at this exact historical commit, and the default
        # depth-1 checkout does not contain it. Fetch only that commit, not the
        # full history; the tests still prove the pinned objects byte-for-byte.
        run: git fetch --no-tags --depth=1 origin c9d491ccbdfa68aedd31692028da5820fcd6638d
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install media probe tools
        timeout-minutes: 12
        continue-on-error: true
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg and ffprobe are already installed; skipping apt."
            ffmpeg -version | head -n 1
            exit 0
          fi
          echo "Installing ffmpeg with a bounded apt attempt; real-media tests skip if it is unavailable."
          if timeout 240 sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update \
            && timeout 300 sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install --no-install-recommends -y ffmpeg; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            echo "::warning::ffmpeg/ffprobe unavailable; real-media tests will skip"
          fi
      - name: Report media probe availability
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "ffmpeg unavailable; media-dependent tests will skip honestly."
          fi
      - name: Install package + dev deps
        run: |
          pip install --require-hashes -r requirements-dev.txt -r requirements-build.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Run pytest
        run: pytest -ra --cov=omakase --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  agent-protocol:
    name: Optional MCP protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked agent and test dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt -r requirements-build.txt -r requirements-agents.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Test actual MCP subprocess and local boundaries
        run: pytest -q tests/plus/test_agent_tools.py
